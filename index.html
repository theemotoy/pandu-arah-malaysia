<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1a73e8">
<meta name="description" content="HalaTuju — aplikasi pandu arah ringan untuk Malaysia">
<title>HalaTuju</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<link href="style.css?v=28" rel="stylesheet">
</head>
<body>
<div id="map"></div>

<!-- ===== Bar carian (atas) ===== -->
<div id="searchbar">
  <div class="search-box">
    <svg class="ic ic-search" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14z"/></svg>
    <input id="q" type="text" placeholder="Cari tempat atau destinasi" autocomplete="off">
    <button id="micbtn" class="mic" title="Carian suara">
      <svg viewBox="0 0 24 24"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg>
    </button>
    <button id="clear" class="x" title="Kosongkan">
      <svg viewBox="0 0 24 24"><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
    </button>
  </div>

  <div id="poibar">
    <button class="poi" data-amenity="masjid"><svg class="poi-ic" viewBox="0 0 24 24"><path d="M12 3a3 3 0 0 0-3 3v2H7a2 2 0 0 0-2 2v3h14v-3a2 2 0 0 0-2-2h-2V6a3 3 0 0 0-3-3zm7 10h-2v7h2v-7zm-12 0H5v7h2v-7z"/></svg>Masjid</button>
    <button class="poi" data-amenity="fuel"><svg class="poi-ic" viewBox="0 0 24 24"><path d="M19.77 7.23l.01-.01-3.72-3.72L15 4.56l2.11 2.11c-.94.36-1.61 1.26-1.61 2.33a2.5 2.5 0 0 0 2.5 2.5c.36 0 .69-.08 1-.21v7.21a1 1 0 0 1-2 0V14a2 2 0 0 0-2-2h-1V5a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v16h10v-7.5h1.5v5.5a2.5 2.5 0 0 0 5 0V9c0-.69-.28-1.32-.73-1.77zM12 10H6V5h6v5z"/></svg>Minyak</button>
    <button class="poi" data-amenity="clinic"><svg class="poi-ic" viewBox="0 0 24 24"><path d="M19 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2zm-1 11h-3v3h-2v-3h-3v-2h3V9h2v3h3v2z"/></svg>Klinik</button>
    <button class="poi" data-amenity="atm"><svg class="poi-ic" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm.31-8.86c-1.77-.45-2.34-.94-2.34-1.67 0-.84.79-1.43 2.1-1.43 1.38 0 1.9.66 1.94 1.64h1.71c-.05-1.34-.87-2.57-2.49-2.97V5H10.9v1.69c-1.51.32-2.72 1.3-2.72 2.81 0 1.79 1.49 2.69 3.66 3.21 1.95.46 2.34 1.15 2.34 1.87 0 .53-.39 1.39-2.1 1.39-1.6 0-2.23-.72-2.32-1.64H8.04c.1 1.7 1.36 2.66 2.86 2.97V19h1.42v-1.69c1.63-.36 2.72-1.32 2.72-2.87 0-1.68-1.32-2.68-3.73-3.3z"/></svg>ATM</button>
    <button class="poi" data-amenity="school"><svg class="poi-ic" viewBox="0 0 24 24"><path d="M12 3 1 9l11 6 9-4.91V17h2V9L12 3zM5 13.18v4L12 21l7-3.82v-4L12 17l-7-3.82z"/></svg>Sekolah</button>
    <button class="poi" data-amenity="hospital"><svg class="poi-ic" viewBox="0 0 24 24"><path d="M19 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2zm-1 11h-3v3h-2v-3h-3v-2h3V9h2v3h3v2z"/></svg>Hospital</button>
  </div>

  <div id="favbar" class="hidden"><div id="favlist"></div></div>
  <div id="histbar" class="hidden"><div id="histlist"></div></div>
  <div id="results"></div>
</div>

<!-- ===== Butang terapung (kanan bawah) ===== -->
<div id="fab-stack">
  <button id="myloc" class="fab" title="Lokasi saya">
    <svg viewBox="0 0 24 24"><path d="M12 8c-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4-1.79-4-4-4zm8.94 3A8.994 8.994 0 0 0 13 3.06V1h-2v2.06A8.994 8.994 0 0 0 3.06 11H1v2h2.06A8.994 8.994 0 0 0 11 20.94V23h2v-2.06A8.994 8.994 0 0 0 20.94 13H23v-2h-2.06zM12 19c-3.87 0-7-3.13-7-7s3.13-7 7-7 7 3.13 7 7-3.13 7-7 7z"/></svg>
  </button>
  <button id="darkbtn" class="fab" title="Mod malam">
    <svg viewBox="0 0 24 24"><path d="M9.37 5.51A7.35 7.35 0 0 0 9.1 7.5c0 4.08 3.32 7.4 7.4 7.4.68 0 1.37-.09 2-.27a7.5 7.5 0 1 1-9.13-9.12z"/></svg>
  </button>
  <button id="menubtn" class="fab" title="Lagi">
    <svg viewBox="0 0 24 24"><path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg>
  </button>
</div>

<!-- Menu sekunder (buka bila tekan "Lagi") -->
<div id="quickmenu" class="hidden">
  <button id="homebtn" class="qitem"><svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg><span>Rumah</span></button>
  <button id="parkbtn" class="qitem"><svg viewBox="0 0 24 24"><path d="M13 3H7v18h2v-8h4a6 6 0 0 0 0-12zm0 8H9V5h4a3 3 0 0 1 0 6z"/></svg><span>Parkir</span></button>
  <button id="addplacebtn" class="qitem"><svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg><span>Tambah</span></button>
  <button id="statsbtn" class="qitem"><svg viewBox="0 0 24 24"><path d="M19 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2zm-9 14H7v-7h3v7zm5 0h-3V7h3v10z"/></svg><span>Statistik</span></button>
  <button id="voicebtn" class="qitem"><svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg><span>Suara</span></button>
  <button id="rnrbtn" class="qitem"><svg viewBox="0 0 24 24"><path d="M20 8h-3V4H3a2 2 0 0 0-2 2v11h2a3 3 0 0 0 6 0h6a3 3 0 0 0 6 0h2v-5l-3-4zM6 18.5A1.5 1.5 0 0 1 4.5 17 1.5 1.5 0 0 1 6 15.5 1.5 1.5 0 0 1 7.5 17 1.5 1.5 0 0 1 6 18.5zm12 0a1.5 1.5 0 0 1-1.5-1.5 1.5 1.5 0 0 1 1.5-1.5 1.5 1.5 0 0 1 1.5 1.5 1.5 1.5 0 0 1-1.5 1.5zM17 8l1.5 2.5H17V8z"/></svg><span>R&amp;R / Tol</span></button>
  <button id="mapbtn" class="qitem"><svg viewBox="0 0 24 24"><path d="M12 2 2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg><span>Peta</span></button>
</div>

<!-- ===== Modal peta (style + 3D) ===== -->
<div id="mapmodal" class="hidden">
  <div class="modal-box">
    <div class="modal-title">Pilihan Peta</div>
    <div class="modal-sub">Tukar gaya peta & bangunan 3D</div>
    <div id="map-options">
      <button class="map-opt" data-mode="night"><span class="ro-ic">🌙</span><span>Mod malam: Dark</span></button>
      <button class="map-opt" data-mode="fiord"><span class="ro-ic">🌃</span><span>Mod malam: Fiord</span></button>
      <button class="map-opt" data-mode="day"><span class="ro-ic">☀️</span><span>Mod siang: Liberty</span></button>
      <button class="map-opt" data-mode="3d"><span class="ro-ic">🏙️</span><span>Bangunan 3D: ON/OFF</span></button>
    </div>
    <div class="modal-actions">
      <button id="map-close" class="primary">Tutup</button>
    </div>
  </div>
</div>

<!-- ===== Modal suara ===== -->
<div id="voicemodal" class="hidden">
  <div class="modal-box">
    <div class="modal-title">Pilih Suara Pandu Arah</div>
    <div class="modal-sub">Ubah watak suara (kadar & nada berbeza)</div>
    <div id="voice-list"></div>
    <div class="modal-actions">
      <button id="voice-test" class="ghost">▶ Uji suara</button>
      <button id="voice-close" class="primary">Simpan</button>
    </div>
  </div>
</div>

<!-- ===== Modal statistik ===== -->
<div id="statsmodal" class="hidden">
  <div class="modal-box">
    <div class="modal-title">Statistik HalaTuju</div>
    <div class="stats-grid">
      <div class="stat-card"><div class="stat-num" id="stat-total">—</div><div class="stat-label">Tempat pangkalan</div></div>
      <div class="stat-card"><div class="stat-num" id="stat-today">—</div><div class="stat-label">Hari ini</div></div>
      <div class="stat-card"><div class="stat-num" id="stat-favs">—</div><div class="stat-label">Kegemaran</div></div>
      <div class="stat-card"><div class="stat-num" id="stat-history">—</div><div class="stat-label">Sejarah</div></div>
    </div>
    <div class="modal-actions"><button id="stats-close" class="primary">Tutup</button></div>
  </div>
</div>

<!-- ===== Modal tambah tempat ===== -->
<div id="addplacemodal" class="hidden">
  <div class="modal-box">
    <div class="modal-title">Tambah Tempat</div>
    <div id="addplace-coords" class="modal-sub"></div>
    <input id="addplace-name" type="text" placeholder="Nama tempat" autocomplete="off">
    <input id="addplace-latlng" type="text" placeholder="Koordinat (lat, lng) — pilihan" autocomplete="off" inputmode="decimal">
    <select id="addplace-type">
      <option value="shop">Kedai / Perniagaan</option>
      <option value="amenity=place_of_worship">Tempat ibadah</option>
      <option value="amenity=school">Sekolah</option>
      <option value="amenity=restaurant">Restoran</option>
      <option value="amenity=cafe">Kafe</option>
      <option value="amenity=fuel">Stesen minyak</option>
      <option value="amenity=hospital">Hospital / Klinik</option>
      <option value="tourism=attraction">Tempat menarik</option>
      <option value="other">Lain-lain</option>
      <option value="custom">Custom (taip sendiri)</option>
    </select>
    <input id="addplace-custom-type" type="text" class="hidden" placeholder="Jenis tempat" autocomplete="off">
    <div class="modal-actions">
      <button id="addplace-save" class="primary">Simpan</button>
      <button id="addplace-osm" class="ghost">Sumbang ke OSM</button>
      <button id="addplace-cancel" class="ghost">Batal</button>
    </div>
  </div>
</div>

<!-- ===== Panel laluan (bottom sheet) ===== -->
<div id="routepanel" class="hidden">
  <div class="sheet-handle" id="sheethandle"><div class="handle-bar"></div></div>
  <div class="sheet-head">
    <div id="routesummary"></div>
    <button id="collapsebtn" class="collapse-btn" title="Sembunyi">
      <svg viewBox="0 0 24 24"><path d="M7.41 8.59 12 13.17l4.59-4.58L18 10l-6 6-6-6z"/></svg>
    </button>
  </div>
  <div class="sheet-body" id="sheetbody">
    <div id="stopsbar"></div>
    <div id="stopsalong">
      <button class="stopalong" data-cat="fuel">⛽ Minyak</button>
      <button class="stopalong" data-cat="masjid">🕌 Surau</button>
      <button class="stopalong" data-cat="clinic">🏥 Klinik</button>
    </div>
    <div id="alternates"></div>
    <div id="routeopts">
      <label class="opt"><input type="radio" name="mode" value="fastest" checked> Paling pantas</label>
      <label class="opt"><input type="radio" name="mode" value="shortest"> Paling dekat</label>
      <label class="opt chk"><input type="checkbox" id="avoidToll"> Elak tol</label>
      <label class="opt chk"><input type="checkbox" id="avoidHighway"> Elak lebuh raya</label>
    </div>
    <div class="travel-opts">
      <button class="travel active" data-travel="auto"><svg viewBox="0 0 24 24"><path d="M18.92 6.01C18.72 5.42 18.16 5 17.5 5h-11c-.66 0-1.21.42-1.42 1.01L3 12v8c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h12v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-8l-2.08-5.99zM6.5 16c-.83 0-1.5-.67-1.5-1.5S5.67 13 6.5 13s1.5.67 1.5 1.5S7.33 16 6.5 16zm11 0c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zM5 11l1.5-4.5h11L19 11H5z"/></svg> Kereta</button>
      <button class="travel" data-travel="pedestrian"><svg viewBox="0 0 24 24"><path d="M13.5 5.5c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zM9.8 8.9L7 23h2.1l1.8-8 2.1 2v6h2v-7.5l-2.1-2 .6-3C14.8 12 16.8 13 19 13v-2c-1.9 0-3.5-1-4.3-2.4l-1-1.6c-.4-.6-1-1-1.7-1-.3 0-.5.1-.8.1L6 8.3V13h2V9.6l1.8-.7z"/></svg> Jalan</button>
      <button class="travel" data-travel="bicycle"><svg viewBox="0 0 24 24"><path d="M15.5 5.5c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zM5 12c-2.8 0-5 2.2-5 5s2.2 5 5 5 5-2.2 5-5-2.2-5-5-5zm0 8.5c-1.9 0-3.5-1.6-3.5-3.5s1.6-3.5 3.5-3.5 3.5 1.6 3.5 3.5-1.6 3.5-3.5 3.5zm5.8-10l2.4-2.4.8.8c1.3 1.3 3 2.1 5.1 2.1V9c-1.5 0-2.7-.6-3.6-1.5l-1.9-1.9c-.5-.4-1-.6-1.6-.6s-1.1.2-1.4.6L7.8 8.4c-.4.4-.6.9-.6 1.4 0 .6.2 1.1.6 1.4L11 14v5h2v-6.2l-2.2-2.3zM19 12c-2.8 0-5 2.2-5 5s2.2 5 5 5 5-2.2 5-5-2.2-5-5-5zm0 8.5c-1.9 0-3.5-1.6-3.5-3.5s1.6-3.5 3.5-3.5 3.5 1.6 3.5 3.5-1.6 3.5-3.5 3.5z"/></svg> Basikal</button>
    </div>
    <div class="row">
      <button id="addstopbtn" class="ghost">+ Hentian</button>
      <button id="savefav" class="ghost">Simpan</button>
      <button id="gobtn" class="primary">Mula Pandu Arah</button>
      <button id="cancelroute" class="ghost">Batal</button>
    </div>
  </div>
</div>

<!-- ===== Banner navigasi aktif (atas) ===== -->
<div id="navbanner" class="hidden">
  <div id="navmaneuver" class="maneuver-icon"></div>
  <div class="nav-text">
    <div id="navinstruction">—</div>
    <div id="navdistance">—</div>
  </div>
</div>

<!-- ===== Bar bawah navigasi (satu bar bersih: laju + ETA + Tamat) ===== -->
<div id="navbottom" class="hidden">
  <div class="speed-cluster">
    <div id="speedbox"><span id="speedval">0</span><span class="unit">km/j</span></div>
    <div id="limitbox"><span id="limitval">—</span></div>
  </div>
  <div class="eta-cluster">
    <div id="naveta">—</div>
    <div id="navremaining">—</div>
  </div>
  <button id="recenter" class="ghost">Pusat</button>
  <button id="stopnav" class="danger">Tamat</button>
  <button id="reportbtn" title="Lapor insiden">
    <svg viewBox="0 0 24 24"><path d="M19 3h-4.18C14.4 1.84 13.3 1 12 1s-2.4.84-2.82 2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2zm-7 0c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm-2 14-4-4 1.41-1.41L10 14.17l6.59-6.59L18 9l-8 8z"/></svg>
  </button>
</div>

<!-- ===== Modal lapor insiden ===== -->
<div id="reportmodal" class="hidden">
  <div class="modal-box">
    <div class="modal-title">Lapor Insiden</div>
    <div class="modal-sub">Pilih jenis insiden untuk kongsikan kepada pemandu lain</div>
    <div id="report-grid">
      <button class="report-opt" data-type="accident"><span class="ro-ic">💥</span><span>Kemalangan</span></button>
      <button class="report-opt" data-type="jam"><span class="ro-ic">🚗</span><span>Jam</span></button>
      <button class="report-opt" data-type="hazard"><span class="ro-ic">⚠️</span><span>Bahaya</span></button>
      <button class="report-opt" data-type="police"><span class="ro-ic">🚔</span><span>Polis</span></button>
    </div>
    <div class="modal-actions">
      <button id="report-cancel" class="ghost">Batal</button>
    </div>
  </div>
</div>

<div id="toast"></div>
<div id="copyright">HalaTuju © 2026 Ashraf</div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="places-johor.js?v=38"></script>
<script src="rnr-johor.js?v=38"></script>
<script src="app.js?v=38"></script>
</body>
</html>
