<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1e88e5">
<meta name="description" content="HalaTuju — aplikasi pandu arah ringan untuk Malaysia">
<title>HalaTuju</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<link href="style.css?v=20" rel="stylesheet">
</head>
<body>
<div id="map"></div>

<!-- Bar carian + semua elemen atas (satu kontena, tiada overlap) -->
<div id="searchbar">
  <div class="search-box">
    <button id="micbtn" class="mic" title="Carian suara">
      <svg viewBox="0 0 24 24"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg>
    </button>
    <svg class="ic" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14z"/></svg>
    <input id="q" type="text" placeholder="Cari tempat… (contoh: Masjid Negara, Menara KL)" autocomplete="off">
    <button id="clear" class="x" title="Kosongkan">✕</button>
  </div>

  <!-- Butang POI cepat -->
  <div id="poibar">
    <button class="poi" data-amenity="masjid">🕌 Masjid</button>
    <button class="poi" data-amenity="fuel">⛽ Minyak</button>
    <button class="poi" data-amenity="clinic">🏥 Klinik</button>
    <button class="poi" data-amenity="atm">🏧 ATM</button>
    <button class="poi" data-amenity="school">🏫 Sekolah</button>
    <button class="poi" data-amenity="hospital">🚑 Hospital</button>
  </div>

  <!-- Panel kegemaran -->
  <div id="favbar" class="hidden">
    <div id="favlist"></div>
    <button id="favmanage" class="ghost small">⭐ Urus</button>
  </div>

  <!-- Panel sejarah -->
  <div id="histbar" class="hidden">
    <div id="histlist"></div>
  </div>

  <div id="results"></div>
</div>

<!-- Butang terapung -->
<button id="myloc" class="fab" title="Lokasi saya">
  <svg viewBox="0 0 24 24"><path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zm8.94 3A8.994 8.994 0 0 0 13 3.06V1h-2v2.06A8.994 8.994 0 0 0 3.06 11H1v2h2.06A8.994 8.994 0 0 0 11 20.94V23h2v-2.06A8.994 8.994 0 0 0 20.94 13H23v-2h-2.06zM12 19a7 7 0 1 1 0-14 7 7 0 0 1 0 14z"/></svg>
</button>
<button id="darkbtn" class="fab fab2" title="Mod malam">
  <svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 0 1-4.4 2.26 5.403 5.403 0 0 1-3.14-9.8c-.44-.06-.9-.1-1.36-.1z"/></svg>
</button>
<button id="homebtn" class="fab fab3" title="Rumah">
  <span class="fab-emoji">🏠</span>
</button>
<button id="parkbtn" class="fab fab4" title="Parkir">
  <span class="fab-emoji">🅿️</span>
</button>
<button id="addplacebtn" class="fab fab5" title="Tambah tempat">
  <span class="fab-emoji">➕</span>
</button>
<button id="statsbtn" class="fab fab6" title="Statistik">
  <span class="fab-emoji">📊</span>
</button>

<!-- Modal statistik -->
<div id="statsmodal" class="hidden">
  <div class="modal-box">
    <div class="modal-title">📊 Statistik HalaTuju</div>
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-num" id="stat-total">—</div>
        <div class="stat-label">Tempat dalam pangkalan</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" id="stat-today">—</div>
        <div class="stat-label">Ditambah hari ini</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" id="stat-favs">—</div>
        <div class="stat-label">Kegemaran anda</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" id="stat-history">—</div>
        <div class="stat-label">Sejarah anda</div>
      </div>
    </div>
    <div class="modal-actions">
      <button id="stats-close" class="primary">Tutup</button>
    </div>
  </div>
</div>

<!-- Modal tambah tempat -->
<div id="addplacemodal" class="hidden">
  <div class="modal-box">
    <div class="modal-title">➕ Tambah Tempat</div>
    <div id="addplace-coords" class="modal-sub"></div>
    <input id="addplace-name" type="text" placeholder="Nama tempat (contoh: Kedai Roti Pak Ali)" autocomplete="off">
    <input id="addplace-latlng" type="text" placeholder="Koordinat (lat, lng) — pilihan, contoh: 1.6787, 103.6412" autocomplete="off" inputmode="decimal">
    <select id="addplace-type">
      <option value="shop">🏪 Kedai / Perniagaan</option>
      <option value="amenity=place_of_worship">🕌 Tempat ibadah</option>
      <option value="amenity=school">🏫 Sekolah</option>
      <option value="amenity=restaurant">🍽️ Restoran</option>
      <option value="amenity=cafe">☕ Kafe</option>
      <option value="amenity=fuel">⛽ Stesen minyak</option>
      <option value="amenity=hospital">🏥 Hospital / Klinik</option>
      <option value="tourism=attraction">📸 Tempat menarik</option>
      <option value="other">📍 Lain-lain</option>
      <option value="custom">✏️ Custom (taip sendiri)</option>
    </select>
    <input id="addplace-custom-type" type="text" class="hidden" placeholder="Jenis tempat (contoh: Bengkel, Kedai kek, Surau...)" autocomplete="off">
    <div class="modal-actions">
      <button id="addplace-save" class="primary">Simpan</button>
      <button id="addplace-osm" class="ghost">Sumbang ke OSM</button>
      <button id="addplace-cancel" class="ghost">Batal</button>
    </div>
  </div>
</div>

<!-- Panel ringkasan laluan -->
<div id="routepanel" class="hidden">
  <div class="sheet-handle" id="sheethandle">
    <div class="handle-bar"></div>
  </div>
  <div class="sheet-head">
    <div id="routesummary"></div>
    <button id="collapsebtn" class="collapse-btn" title="Sembunyi">⌄</button>
  </div>
  <div class="sheet-body" id="sheetbody">
    <div id="alternates"></div>
    <div id="routeopts">
      <label class="opt"><input type="radio" name="mode" value="fastest" checked> 🚀 Paling pantas</label>
      <label class="opt"><input type="radio" name="mode" value="shortest"> 📏 Paling dekat</label>
      <label class="opt chk"><input type="checkbox" id="avoidToll"> 🚧 Elak tol</label>
      <label class="opt chk"><input type="checkbox" id="avoidHighway"> 🛣️ Elak lebuh raya</label>
      <label class="opt"><input type="radio" name="travel" value="auto" checked> 🚗 Kereta</label>
      <label class="opt"><input type="radio" name="travel" value="pedestrian"> 🚶 Jalan kaki</label>
      <label class="opt"><input type="radio" name="travel" value="bicycle"> 🚲 Basikal</label>
    </div>
    <div class="row">
      <button id="savefav" class="ghost">⭐ Simpan</button>
      <button id="gobtn" class="primary">🚗 Mula Pandu Arah</button>
      <button id="cancelroute" class="ghost">Batal</button>
    </div>
  </div>
</div>

<!-- Banner navigasi aktif -->
<div id="navbanner" class="hidden">
  <div class="nav-top">
    <div id="navmaneuver" class="maneuver-icon"></div>
    <div class="nav-text">
      <div id="navinstruction">—</div>
      <div id="navdistance">—</div>
    </div>
    <div class="nav-meta">
      <div id="naveta">—</div>
      <div id="navremaining">—</div>
    </div>
  </div>
  <div id="speedbox" class="hidden"><span id="speedval">0</span><span class="unit">km/j</span></div>
  <div id="limitbox" class="hidden">🛑 Had laju <span id="limitval">—</span></div>
  <div class="nav-bottom">
    <button id="stopnav" class="danger">✕ Tamat</button>
    <button id="recenter" class="ghost">📍 Pusat</button>
  </div>
</div>

<div id="toast"></div>

<div id="copyright">HalaTuju © 2026 Ashraf</div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="places-johor.js?v=20"></script>
<script src="app.js?v=20"></script>
</body>
</html>
